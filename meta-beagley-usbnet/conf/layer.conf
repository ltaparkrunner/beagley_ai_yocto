# Нам доступны рецепты в текущей директории слоя
BBPATH .= ":${LAYERDIR}"

# Ищем файлы рецептов (.bb) и аппендов (.bbappend)
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-beagley-usbnet"
BBFILE_PATTERN_meta-beagley-usbnet = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-beagley-usbnet = "10"

LAYERSERIES_COMPAT_meta-beagley-usbnet = "scarthgap"

