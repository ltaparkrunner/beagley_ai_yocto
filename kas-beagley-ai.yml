header:
  version: 14

machine: beagley-ai
distro: poky
target: core-image-minimal

repos:
  beagley_ai_yocto:
    layers:
      meta-beagley-usbnet:

  poky:
    url: "https://git.yoctoproject.org/poky"
    branch: "scarthgap"
    layers:
      meta:
      meta-poky:
      meta-yocto-bsp:

  meta-openembedded:
    url: "https://github.com/openembedded/meta-openembedded.git"
    branch: "scarthgap"
    layers:
      meta-oe:
      meta-python:
      meta-networking:

  meta-arm:
    url: "https://git.yoctoproject.org/meta-arm"
    branch: "scarthgap"
    layers:
      meta-arm:
      meta-arm-toolchain:

  meta-ti:
    url: "https://git.yoctoproject.org/meta-ti"
    branch: "scarthgap"
    layers:
      meta-ti-bsp:
      meta-beagle:

local_conf_header:
  custom-settings: |
    # Оптимизация сборки под ваш процессор
    BB_NUMBER_THREADS = "${@oe.utils.cpu_count()}"
    PARALLEL_MAKE = "-j ${@oe.utils.cpu_count()}"
    
    # Пакетный менеджер
    PACKAGE_CLASSES = "package_ipk"
    
    # Добавление SSH и отладочных хаков для пустого root-пароля
    IMAGE_FEATURES += "ssh-server-openssh"
    EXTRA_IMAGE_FEATURES += "debug-tweaks"

    # ХАК ДЛЯ ОБХОДА МИКСИНА: полностью изолируем рецепты ядра 6.12.
    BBMASK += "meta-ti/meta-ti-bsp/recipes-kernel/linux/linux-ti-staging_6.12.bb"

    # ==========================================================================
    # ПЕРЕКЛЮЧЕНИЕ НА SYSTEMD И СЕТЕВЫЕ СЛУЖБЫ
    # ==========================================================================
    INIT_MANAGER = "systemd"
    DISTRO_FEATURES:append = " systemd"
    DISTRO_FEATURES_BACKFILL_CONSIDERED += "sysvinit"
    VIRTUAL-RUNTIME_init_manager = "systemd"
    VIRTUAL-RUNTIME_initscripts = "systemd-compat-units"

    # Исправлено: ставим основной пакет systemd (внутри него уже есть networkd)
    IMAGE_INSTALL:append = " systemd"
    
    # Автозапуск драйвера Ethernet-over-USB при старте ядра
    KERNEL_MODULE_AUTOLOAD += "g_ether"

