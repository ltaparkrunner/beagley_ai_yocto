header:
  version: 14

machine: beagley-ai
distro: arago
target: core-image-minimal

repos:
  beagley_ai_yocto:
    path: .
    layers:
      meta-beagley-usbnet:
      meta-beagley-edgeai:

  poky:
    url: "https://git.yoctoproject.org/poky"
    branch: "scarthgap"
    layers:
      meta:
      meta-poky:
      meta-yocto-bsp:

  meta-openembedded:
    url: "https://github.com/openembedded/meta-openembedded.git"
    branch: "scarthgap"
    layers:
      meta-oe:
      meta-python:
      meta-networking:
      meta-multimedia:
      meta-filesystems:

  # https://git.yoctoproject.org/meta-virtualization
  meta-virtualization:
    url: "https://git.yoctoproject.org/meta-virtualization"
    branch: "scarthgap"    

  meta-arm:
    url: "https://git.yoctoproject.org/meta-arm"
    branch: "scarthgap"
    layers:
      meta-arm:
      meta-arm-toolchain:

  meta-clang:
#    url: "https://github.com"
    url: "https://github.com/kraj/meta-clang.git"
    branch: "scarthgap"

  meta-ti:
    url: "https://git.yoctoproject.org/meta-ti"
    branch: "scarthgap"
    layers:
      meta-ti-bsp:
      meta-ti-extras:
      meta-beagle:

  meta-arago:
    url: "https://git.yoctoproject.org/meta-arago"
    branch: "scarthgap"
    layers:
      meta-arago-distro:
      meta-arago-extras:
      meta-arago-test:

  meta-tisdk:
#    url: "https://ti.com"
    url: "https://github.com/TexasInstruments/meta-tisdk.git"
    branch: "scarthgap"
    layers:
      meta-ti-foundational:

  meta-edgeai:
#    url: "https://ti.com"
    url: "https://git.ti.com/git/edgeai/meta-edgeai.git"
    branch: "scarthgap"

local_conf_header:
#  hosttools: |
#    HOSTTOOLS += "ssh"
  custom-settings: |
    # CPU build parallelism
    BB_NUMBER_THREADS = "${@oe.utils.cpu_count()}"
    PARALLEL_MAKE = "-j ${@oe.utils.cpu_count()}"

    # Edge AI configuration for TI AM67A
    ARAGO_BRAND = "edgeai"
    
    # Package manager & SSH access
    PACKAGE_CLASSES = "package_ipk"
    IMAGE_FEATURES += "ssh-server-openssh"
    EXTRA_IMAGE_FEATURES += "debug-tweaks"

    # Keep kernel pinned to 6.6 LTS instead of 6.12
    BBMASK += "meta-ti/meta-ti-bsp/recipes-kernel/linux/linux-ti-staging_6.12.bb"

    # ==========================================================================
    # Systemd init manager (handles systemd & networkd automatically in Scarthgap)
    # ==========================================================================
    INIT_MANAGER = "systemd"

    # USB Gadget Ethernet on boot
    DISTRO_FEATURES:append = " systemd"
    DISTRO_FEATURES_BACKFILL_CONSIDERED += "sysvinit"
    VIRTUAL-RUNTIME_init_manager = "systemd"
    VIRTUAL-RUNTIME_initscripts = "systemd-compat-units"

    # Ensure uEnv.txt is deployed into deploy-ti/images/beagley-ai/ before wic runs
    EXTRA_IMAGEDEPENDS += "tisdk-uenv"

    # Исправлено: ставим основной пакет systemd (внутри него уже есть networkd)
    # AI/ML Runtime, C7x-MMA TIDL, Python, OpenCV & Camera packages
    IMAGE_INSTALL:append = " systemd \
        python3 \
        python3-pip \
        python3-numpy \
        python3-pillow \
        python3-opencv \
        ti-tidl \
        ti-tidl-osrt \
        ti-edgeai-firmware \
        ti-vision-apps \
        v4l-utils \
        kernel-module-uvcvideo \
        libgpiod \
        libgpiod-tools \
        python3-gpiod \
    "
    
    # USB Gadget Ethernet on boot
    KERNEL_MODULE_AUTOLOAD += "g_ether"

